<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Tracker — Nakatomi</title>
  <link rel="icon" type="image/svg+xml" href="/nakatomi-icon.svg">
  <link rel="canonical" href="https://www.nakatomi.no/flight" />
  <meta name="description" content="Spor flygnummer i sanntid på kart – se rute, posisjon og flystatus live." />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .back { color: #555; text-decoration: none; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.2s; }
    .back:hover { color: #e63946; }
    h1 { font-size: 1.6rem; font-weight: 800; }
    h1 span { color: #e63946; }

    .search-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .search-row input {
      flex: 1; min-width: 160px;
      background: #141414; border: 1px solid #222; border-radius: 8px;
      color: #fff; padding: 0.65rem 1rem; font-size: 0.95rem;
      font-family: inherit; outline: none; transition: border-color 0.2s;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .search-row input::placeholder { text-transform: none; letter-spacing: 0; }
    .search-row input:focus { border-color: #e63946; }
    .search-row button {
      background: #e63946; color: #fff; border: none; border-radius: 8px;
      padding: 0.65rem 1.4rem; font-weight: 700; font-size: 0.88rem;
      letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
      font-family: inherit; transition: background 0.15s;
    }
    .search-row button:hover { background: #c72d38; }
    .search-row button:disabled { background: #1e1e1e; color: #444; cursor: not-allowed; }

    .hint {
      font-size: 0.72rem; color: #444; letter-spacing: 0.06em;
      margin-bottom: 1.5rem; line-height: 1.6;
    }
    .hint strong { color: #666; }

    #status { font-size: 0.78rem; color: #555; letter-spacing: 0.08em; margin-bottom: 1rem; min-height: 1.2rem; }
    #status.error { color: #e63946; }
    #status.ok { color: #22c55e; }

    #flight-info { display: none; margin-bottom: 1.5rem; }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.8rem;
    }
    .info-card {
      background: #141414; border: 1px solid #222; border-radius: 10px;
      padding: 1rem 1.2rem;
    }
    .info-label { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: #555; margin-bottom: 0.4rem; }
    .info-value { font-size: 1.1rem; font-weight: 700; }
    .info-sub { font-size: 0.72rem; color: #555; margin-top: 0.15rem; }

    #map-wrap {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #222;
      height: calc(100vh - 300px);
      min-height: 500px;
    }
    #map { height: 100%; }

    .leaflet-container { background: #111; }
    .leaflet-tile-pane { filter: brightness(0.75) saturate(0.6); }
    .leaflet-control-attribution { background: rgba(0,0,0,0.6) !important; color: #555 !important; }
    .leaflet-control-attribution a { color: #555 !important; }

    @media (max-width: 600px) {
      #map-wrap { height: calc(100vh - 280px); min-height: 340px; }
    }
  </style>
</head>
<body>

<header>
  <a class="back" href="/">← Nakat<span style="color:#e63946">o</span>mi</a>
  <h1>Flight<span>Tracker</span></h1>
</header>

<div class="search-row">
  <input id="cs-input" type="text" placeholder="Flynummer: SK123, DY456, LH789..." autocomplete="off" spellcheck="false" maxlength="10" />
  <button id="track-btn">Spor fly</button>
</div>
<div class="hint">
  Skriv flynummeret slik det står på billetten din, f.eks. <strong>SK123</strong>, <strong>DY456</strong>, <strong>WF101</strong>. Oppdateres hvert 15. sek.
</div>

<div id="status"></div>

<div id="flight-info">
  <div class="info-grid">
    <div class="info-card">
      <div class="info-label">Callsign</div>
      <div class="info-value" id="i-cs">—</div>
    </div>
    <div class="info-card">
      <div class="info-label">Høyde</div>
      <div class="info-value" id="i-alt">—</div>
      <div class="info-sub">meter</div>
    </div>
    <div class="info-card">
      <div class="info-label">Hastighet</div>
      <div class="info-value" id="i-spd">—</div>
      <div class="info-sub">km/t</div>
    </div>
    <div class="info-card">
      <div class="info-label">Kurs</div>
      <div class="info-value" id="i-hdg">—</div>
      <div class="info-sub">grader</div>
    </div>
    <div class="info-card">
      <div class="info-label">Flytype</div>
      <div class="info-value" id="i-country" style="font-size:0.9rem">—</div>
    </div>
    <div class="info-card">
      <div class="info-label">Status</div>
      <div class="info-value" id="i-ground" style="font-size:0.9rem">—</div>
    </div>
  </div>
</div>

<div id="map-wrap">
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map', { zoomControl: true }).setView([60, 15], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 18
}).addTo(map);

// ICAO airport code → [lat, lon, IATA, city]
var AIRPORTS = {
  ENGM:[60.1939,11.1004,'OSL','Oslo'],ENBR:[60.2934,5.2181,'BGO','Bergen'],
  ENZV:[58.8767,5.6378,'SVG','Stavanger'],ENVA:[63.4578,10.9258,'TRD','Trondheim'],
  ENTC:[69.6833,18.9189,'TOS','Tromsø'],ENBO:[67.2692,14.3653,'BOO','Bodø'],
  ENFL:[61.5836,5.0244,'FRO','Florø'],ENHD:[59.3453,5.2086,'HAU','Haugesund'],
  ENKR:[70.0678,29.8913,'KKN','Kirkenes'],ENMS:[62.7283,7.2650,'MOL','Molde'],
  EKCH:[55.6181,12.6561,'CPH','København'],ESSA:[59.6519,17.9186,'ARN','Stockholm'],
  ESGG:[57.6628,12.2798,'GOT','Göteborg'],EFHK:[60.3172,24.9633,'HEL','Helsinki'],
  EGLL:[51.4775,-0.4614,'LHR','London'],EGKK:[51.1481,-0.1903,'LGW','London Gatwick'],
  EHAM:[52.3086,4.7639,'AMS','Amsterdam'],EDDF:[50.0333,8.5706,'FRA','Frankfurt'],
  EDDM:[48.3538,11.7861,'MUC','München'],LFPG:[49.0097,2.5478,'CDG','Paris'],
  LEMD:[40.4719,-3.5625,'MAD','Madrid'],LEBL:[41.2971,2.0785,'BCN','Barcelona'],
  LIRF:[41.8003,12.2389,'FCO','Roma'],LIMC:[45.6306,8.7281,'MXP','Milano'],
  LOWW:[48.1103,16.5697,'VIE','Wien'],LSZH:[47.4647,8.5492,'ZRH','Zürich'],
  EBBR:[50.9014,4.4844,'BRU','Brussel'],LPPT:[38.7813,-9.1359,'LIS','Lisboa'],
  LGAV:[37.9364,23.9445,'ATH','Athen'],EPWA:[52.1657,20.9671,'WAW','Warszawa'],
  LKPR:[50.1008,14.26,'PRG','Praha'],LHBP:[47.4369,19.2556,'BUD','Budapest'],
  LROP:[44.5711,26.085,'OTP','București'],UUEE:[55.9736,37.4125,'SVO','Moskva'],
  OMDB:[25.2528,55.3644,'DXB','Dubai'],OBBI:[26.2708,50.6336,'BAH','Bahrain'],
  OTBD:[25.2731,51.6081,'DOH','Doha'],OOMS:[23.5933,58.2844,'MCT','Muskat'],
  WSSS:[1.3502,103.9944,'SIN','Singapore'],VHHH:[22.3089,113.9144,'HKG','Hongkong'],
  RJAA:[35.7648,140.3864,'NRT','Tokyo'],ZBAA:[40.0799,116.6031,'PEK','Beijing'],
  ZSPD:[31.1434,121.8052,'PVG','Shanghai'],YSSY:[-33.9461,151.1772,'SYD','Sydney'],
  YMML:[-37.6733,144.8433,'MEL','Melbourne'],FAOR:[-26.1392,28.246,'JNB','Johannesburg'],
  HECA:[30.1219,31.4056,'CAI','Kairo'],DNMM:[6.5774,3.3216,'LOS','Lagos'],
  KJFK:[40.6398,-73.7789,'JFK','New York'],KLAX:[33.9425,-118.408,'LAX','Los Angeles'],
  KORD:[41.9742,-87.9073,'ORD','Chicago'],KATL:[33.6367,-84.4281,'ATL','Atlanta'],
  KDFW:[32.8998,-97.0403,'DFW','Dallas'],KMIA:[25.7959,-80.287,'MIA','Miami'],
  CYYZ:[43.6772,-79.6306,'YYZ','Toronto'],CYVR:[49.1939,-123.1844,'YVR','Vancouver'],
  SBGR:[-23.4356,-46.4731,'GRU','São Paulo']
};

var planeMarker = null;
var routeLayers = [];
var trackPoints = [];
var refreshTimer = null;
var currentCs = null;

function planeIcon(hdg) {
  var svg = '<svg width="44" height="44" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(' + (hdg||0) + 'deg);transform-origin:50% 50%;display:block">' +
    '<path d="M30 3 C32 3 34 12 34 22 L34 46 C34 50 32 56 30 58 C28 56 26 50 26 46 L26 22 C26 12 28 3 30 3 Z" fill="#e63946" stroke="#111" stroke-width="1.5"/>' +
    '<path d="M34 24 L58 42 L54 46 L30 32 L6 46 L2 42 L26 24 Z" fill="#e63946" stroke="#111" stroke-width="1.5"/>' +
    '<path d="M30 46 L42 54 L39 57 L30 51 L21 57 L18 54 Z" fill="#e63946" stroke="#111" stroke-width="1.5"/>' +
    '</svg>';
  return L.divIcon({
    html: svg,
    iconSize: [44, 44],
    iconAnchor: [22, 22],
    className: ''
  });
}

// IATA (2-letter) → ICAO (3-letter) airline code mapping
var IATA_TO_ICAO = {
  SK: 'SAS', DY: 'NOZ', WF: 'WIF', D8: 'IBK',
  LH: 'DLH', LX: 'SWR', OS: 'AUA', EW: 'EWG',
  BA: 'BAW', VS: 'VIR', U2: 'EZY', FR: 'RYR', BE: 'BEE',
  AF: 'AFR', KL: 'KLM', TO: 'FPO', HV: 'TRA', VY: 'VLG',
  IB: 'IBE', TP: 'TAP', AZ: 'ITY', SN: 'BEL',
  AY: 'FIN', BT: 'BTI', LO: 'LOT', OK: 'CSA',
  TK: 'THY', EK: 'UAE', QR: 'QTR', EY: 'ETD',
  AA: 'AAL', UA: 'UAL', DL: 'DAL', B6: 'JBU', WN: 'SWA',
  AC: 'ACA', WS: 'WJA',
  CX: 'CPA', SQ: 'SIA', JL: 'JAL', NH: 'ANA',
  QF: 'QFA', NZ: 'ANZ',
  DE: 'CFG', X3: 'TUI', OR: 'TFL'
};

function toIcaoCallsign(input) {
  var m = input.match(/^([A-Z]{2,3})(\d+.*)$/);
  if (!m) return input;
  var prefix = m[1], num = m[2];
  if (prefix.length === 2 && IATA_TO_ICAO[prefix]) {
    return IATA_TO_ICAO[prefix] + num;
  }
  return input;
}

var input = document.getElementById('cs-input');
var btn = document.getElementById('track-btn');
var statusEl = document.getElementById('status');

input.addEventListener('keydown', function(e) { if (e.key === 'Enter') startTracking(); });
btn.addEventListener('click', startTracking);

function clearLayers() {
  routeLayers.forEach(function(l) { map.removeLayer(l); });
  routeLayers = [];
}

function startTracking() {
  var raw = input.value.trim().toUpperCase();
  if (!raw) return;
  currentCs = toIcaoCallsign(raw);
  trackPoints = [];
  clearLayers();
  if (planeMarker) { map.removeLayer(planeMarker); planeMarker = null; }
  if (refreshTimer) clearInterval(refreshTimer);
  fetchFlight();
  refreshTimer = setInterval(fetchFlight, 15000);
}

function fetchFlight() {
  statusEl.className = '';
  statusEl.textContent = 'Henter flydata…';
  btn.disabled = true;

  var url = '/api/flight?callsign=' + encodeURIComponent(currentCs);

  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('API svarte med ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!data.ac || data.ac.length === 0) {
        statusEl.className = 'error';
        statusEl.textContent = 'Fant ikke "' + currentCs + '". Flyet er kanskje ikke i lufta, eller callsign er feil.';
        return;
      }
      var ac = data.ac[0];
      if (ac.lat == null || ac.lon == null) {
        statusEl.className = 'error';
        statusEl.textContent = 'Fly funnet, men ingen posisjonsdata ennå.';
        return;
      }
      renderMap(ac);
      renderInfo(ac);
      statusEl.className = 'ok';
      var tid = new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      statusEl.textContent = 'Sist oppdatert ' + tid + '  —  oppdateres automatisk hvert 15. sek';
    })
    .catch(function(err) {
      statusEl.className = 'error';
      statusEl.textContent = 'Feil: ' + err.message;
    })
    .finally(function() { btn.disabled = false; });
}

function renderMap(ac) {
  var lat = ac.lat, lon = ac.lon, hdg = ac.track || 0;
  var origCode = ac.orig || ac.dep || ac.src || null;
  var destCode = ac.dest || ac.dst || ac.arr || null;

  trackPoints.push([lat, lon]);
  if (trackPoints.length > 120) trackPoints.shift();

  clearLayers();

  // Rute fra avgangsflyplass
  var origAp = origCode && AIRPORTS[origCode];
  if (origAp) {
    routeLayers.push(L.polyline([[origAp[0], origAp[1]], [lat, lon]], {
      color: '#e63946', weight: 2, opacity: 0.35, dashArray: '6 5'
    }).addTo(map));
    routeLayers.push(L.circleMarker([origAp[0], origAp[1]], {
      radius: 5, color: '#e63946', fillColor: '#0a0a0a', fillOpacity: 1, weight: 2
    }).addTo(map).bindTooltip(origAp[2] + ' — ' + origAp[3], { permanent: false, direction: 'top' }));
  }

  // Rute til destinasjon
  var destAp = destCode && AIRPORTS[destCode];
  if (destAp) {
    routeLayers.push(L.polyline([[lat, lon], [destAp[0], destAp[1]]], {
      color: '#888', weight: 2, opacity: 0.25, dashArray: '4 6'
    }).addTo(map));
    routeLayers.push(L.circleMarker([destAp[0], destAp[1]], {
      radius: 5, color: '#888', fillColor: '#0a0a0a', fillOpacity: 1, weight: 2
    }).addTo(map).bindTooltip(destAp[2] + ' — ' + destAp[3], { permanent: false, direction: 'top' }));
  }

  // Sporingstråd (faktisk rute siden siden ble lastet)
  if (trackPoints.length > 1) {
    routeLayers.push(L.polyline(trackPoints, { color: '#e63946', weight: 3, opacity: 0.7 }).addTo(map));
  }
  trackPoints.forEach(function(p, i) {
    if (i < trackPoints.length - 1) {
      routeLayers.push(L.circleMarker(p, { radius: 3, color: '#e63946', fillColor: '#e63946', fillOpacity: 0.5, weight: 0 }).addTo(map));
    }
  });

  if (planeMarker) {
    planeMarker.setLatLng([lat, lon]);
    planeMarker.setIcon(planeIcon(hdg));
  } else {
    planeMarker = L.marker([lat, lon], { icon: planeIcon(hdg) }).addTo(map);
    map.setView([lat, lon], 6);
  }
}

function apLabel(code) {
  var ap = code && AIRPORTS[code];
  return ap ? ap[2] : (code || '—');
}

function renderInfo(ac) {
  var cs = (ac.flight || '').trim();
  var altFt = ac.alt_geom || ac.alt_baro;
  var alt = (typeof altFt === 'number') ? Math.round(altFt * 0.3048) : null;
  var spd = ac.gs != null ? Math.round(ac.gs * 1.852) : null;
  var hdg = ac.track != null ? Math.round(ac.track) : null;
  var onGround = ac.alt_baro === 'ground' || ac.on_ground === true;
  var origCode = ac.orig || ac.dep || ac.src || null;
  var destCode = ac.dest || ac.dst || ac.arr || null;

  var csEl = document.getElementById('i-cs');
  if (origCode || destCode) {
    csEl.textContent = apLabel(origCode) + ' → ' + apLabel(destCode);
    csEl.style.fontSize = '0.9rem';
  } else {
    csEl.textContent = cs || currentCs;
    csEl.style.fontSize = '';
  }

  document.getElementById('i-alt').textContent = alt != null ? alt.toLocaleString('no-NO') : '—';
  document.getElementById('i-spd').textContent = spd != null ? spd.toLocaleString('no-NO') : '—';
  document.getElementById('i-hdg').textContent = hdg != null ? hdg + '°' : '—';
  document.getElementById('i-country').textContent = ac.t || '—';

  var gEl = document.getElementById('i-ground');
  gEl.textContent = onGround ? 'På bakken' : 'I lufta';
  gEl.style.color = onGround ? '#f59e0b' : '#22c55e';

  document.getElementById('flight-info').style.display = 'block';
}
</script>
</body>
</html>
